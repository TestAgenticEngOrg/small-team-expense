openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Expenses, categories, and manager decisions.
servers:
  - url: /

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            expenses:read: The caller's own expenses
            expenses:submit: Submit a new expense
            expenses:review-team: The expenses of the caller's reports
            expenses:approve: Approve a submitted expense
            expenses:reject: Reject a submitted expense
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Category:
      type: string
      enum: [Travel, Meals, Lodging, "Office Supplies", Software, Other]
    ExpenseStatus:
      type: string
      enum: [pending, approved, rejected]
    Expense:
      type: object
      required: [id, employeeId, vendor, expenseDate, amount, category, status, createdAt]
      properties:
        id: { type: string }
        employeeId: { type: string }
        vendor: { type: string }
        expenseDate: { type: string, format: date }
        amount: { type: number, format: double }
        category: { $ref: '#/components/schemas/Category' }
        photoUrl: { type: string }
        status: { $ref: '#/components/schemas/ExpenseStatus' }
        managerComment: { type: string, nullable: true }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ExpenseCreate:
      type: object
      required: [vendor, expenseDate, amount, category]
      properties:
        vendor: { type: string }
        expenseDate: { type: string, format: date }
        amount: { type: number, format: double }
        category: { $ref: '#/components/schemas/Category' }
        photoUrl: { type: string }
    ExpenseDecision:
      type: object
      properties:
        comment: { type: string, nullable: true }
    ExpenseList:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true, description: relative URI of the next page }
        previous: { type: string, nullable: true, description: relative URI of the previous page }
        data:
          type: array
          items: { $ref: '#/components/schemas/Expense' }

security:
  - oauth2: []

paths:
  /categories:
    get:
      operationId: listCategories
      summary: The fixed list of expense categories
      security: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /me/expenses:
    get:
      operationId: listMyExpenses
      summary: The caller's own expenses
      security:
        - oauth2: [expenses:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExpenseStatus' }
      responses:
        '200':
          description: The caller's expenses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseList' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitMyExpense
      summary: Submit a new expense
      security:
        - oauth2: [expenses:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '201':
          description: Expense created, pending decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          description: A required field is missing or invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/expenses/{expenseId}:
    get:
      operationId: getMyExpense
      summary: The caller's own expense
      security:
        - oauth2: [expenses:read]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404':
          description: No such expense of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/team/expenses:
    get:
      operationId: listTeamExpenses
      summary: The expenses of the caller's reports
      security:
        - oauth2: [expenses:review-team]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExpenseStatus' }
      responses:
        '200':
          description: Expenses submitted by the caller's reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseList' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/team/expenses/{expenseId}/approve:
    post:
      operationId: approveTeamExpense
      summary: Approve a report's submitted expense
      security:
        - oauth2: [expenses:approve]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseDecision' }
      responses:
        '200':
          description: Expense approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404':
          description: No such pending expense of a report's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400':
          description: The expense is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/team/expenses/{expenseId}/reject:
    post:
      operationId: rejectTeamExpense
      summary: Reject a report's submitted expense
      security:
        - oauth2: [expenses:reject]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseDecision' }
      responses:
        '200':
          description: Expense rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404':
          description: No such pending expense of a report's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400':
          description: The expense is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
