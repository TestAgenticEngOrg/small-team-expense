apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: expense-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: small-team-expense-expense-api
      name: http
      visibility: project
      envBindings:
        address: EXPENSE_API_URL
    - component: small-team-expense-receipt-extraction-agent
      name: http
      visibility: project
      envBindings:
        address: RECEIPT_EXTRACTION_AGENT_URL
  resources:
    - ref: small-team-expens-66039da2
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
