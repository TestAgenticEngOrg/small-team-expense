apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: receipt-extraction-agent

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: small-team-expens-0f7c87ce
      envBindings:
        dbname: MEMORY_DB_DBNAME
        host: MEMORY_DB_HOST
        password: MEMORY_DB_PASSWORD
        port: MEMORY_DB_PORT
        user: MEMORY_DB_USER
    - ref: small-team-expens-66039da2
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
